name: CI

# Runs on every push to main and on every pull request. Nothing here deploys or publishes.
# Third-party actions are pinned to commit SHAs (the comment names the release), so a moved tag cannot change what runs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (data, SQL, API, alerts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      # The pipeline is deterministic, so rebuilding must reproduce the committed files exactly. A difference means someone
      # changed the code or the raw data without regenerating data/processed (or the build stopped being deterministic).
      - name: Regenerated data matches what is committed
        run: |
          npm run data:build
          npm run cost:build
          if [ -n "$(git status --porcelain -- data/processed)" ]; then
            echo "::error::data/processed is out of date. Run 'npm run data:build && npm run cost:build' and commit the result."
            git status --short -- data/processed
            exit 1
          fi

      - name: Tests (pipeline, SQL, API, alerts, WebSocket, static UI)
        run: npm test

      # Offline: checks the explanation validator against a corpus of hallucinations and runs the rule-based control. No model is called.
      - name: AI explanation checks (offline)
        run: npm run triage:eval

      # Re-derives the headline numbers from the raw CSV in Python (nothing shared with the app) and compares them item by item.
      # Also checks the SQL statically as Snowflake SQL (needs the one package in validation/requirements.txt). A virtual environment keeps this
      # working on any runner image; REQUIRE_SQLGLOT makes a missing package a failure here instead of a quiet skip.
      - name: Independent validation (Python, with a SQL parser)
        env:
          REQUIRE_SQLGLOT: '1'
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet -r validation/requirements.txt
          npm run validate

      - name: Dependency audit (high and above)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (React app)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Tests (live feed client, API client, pages, contrast)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit (high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Keep the build for the smoke test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: Full stack starts and works
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Starts the real server with the built UI, signs in, opens the WebSocket, and checks the permission rules.
      - name: Smoke test
        run: npm run smoke

      # Restarts the server mid-stream with the real browser feed client attached, and checks alerts keep arriving.
      - name: Restart recovery
        run: npm run smoke:restart
